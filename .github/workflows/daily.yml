name: Relatorio Diario Kommo

on:
  schedule:
    # a cada 15 min, das 10h às 22h UTC = 7h às 19h em Brasília (horário comercial).
    # Minutos deslocados (07/22/37/52 em vez de 00/15/30/45) pra evitar o
    # horário de pico que todo cron do mundo usa nos minutos redondos —
    # o GitHub avisa que agendamentos em pico podem atrasar ou ser descartados.
    - cron: '7,22,37,52 10-22 * * *'

  workflow_dispatch:
    inputs:
      mes:
        description: 'Mês retroativo (1-12). Deixe vazio para rodar normal (hoje).'
        required: false
        default: ''
      ano:
        description: 'Ano retroativo (ex: 2026). Deixe vazio para rodar normal (hoje).'
        required: false
        default: ''

jobs:
  rodar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar relatorio
        env:
          KOMMO_SUBDOMAIN: ${{ secrets.KOMMO_SUBDOMAIN }}
          KOMMO_TOKEN: ${{ secrets.KOMMO_TOKEN }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          MES: ${{ github.event.inputs.mes }}
          ANO: ${{ github.event.inputs.ano }}
        run: python relatorio_diario.py
